name: Desktop builds
on: [workflow_dispatch, push]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: scripts/runtimes.mjs
      - run: npm ci
      - run: npm run runtime
      - run: npm test
      - run: npm run test:desktop
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v6
        with:
          name: frame-studio-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
