name: Desktop builds
on:
  push:
    branches: ['**']
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已有版本标签（用于补传安装包，留空只构建）'
        type: string
        required: false
      replace_macos:
        description: '用签名并公证的新 DMG 替换该 Release 的 macOS 安装包'
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Require a tag when replacing a macOS installer
        if: inputs.replace_macos && env.RELEASE_TAG == ''
        shell: bash
        run: |
          echo 'Select a release_tag when replacing a macOS installer.'
          exit 1
      - name: Verify release version
        if: env.RELEASE_TAG != ''
        run: >-
          node -e "const tag = process.env.RELEASE_TAG;
          if (!/^v?[0-9]+[.][0-9]+[.][0-9]+$/.test(tag) ||
          tag.replace(/^v/, '') !== require('./package.json').version)
          throw Error('Release tag must match the version in package.json');"
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: scripts/runtimes.mjs
      - run: npm ci
      - run: npm run runtime
      - run: npm test
      - run: npm run test:desktop
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - name: Build installer
        if: runner.os != 'macOS' || env.RELEASE_TAG == ''
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign macOS release installer
        if: runner.os == 'macOS' && env.RELEASE_TAG != ''
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          : "${CSC_LINK:?Missing MAC_CSC_LINK (base64 Developer ID Application .p12)}"
          : "${CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD}"
          # 公证票据会改变 DMG 的字节，发布流程只上传最终 DMG。
          npm run dist -- --publish never \
            -c.mac.type=distribution -c.mac.hardenedRuntime=true -c.mac.forceCodeSigning=true \
            -c.mac.notarize=false -c.dmg.sign=true -c.dmg.writeUpdateInfo=false
      - name: Notarize and verify macOS release installer
        if: runner.os == 'macOS' && env.RELEASE_TAG != ''
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          shopt -s nullglob
          images=(release/Frame-Studio-"${RELEASE_TAG#v}"-mac-*.dmg)
          if (( ${#images[@]} != 1 )); then
            echo 'Expected exactly one macOS release DMG.'
            exit 1
          fi
          dmg=${images[0]}
          codesign --verify --strict --verbose=2 \
            -R='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' "$dmg"

          # 按 Apple 的分发流程公证最外层 DMG，并在上传前验证附带的票据。
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          if ! result=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json) ||
             ! jq -e '.status == "Accepted"' <<< "$result" >/dev/null; then
            echo 'Apple notarization did not accept the DMG.'
            echo "$result"
            submission=$(jq -r '.id // empty' <<< "$result")
            if [[ -n "$submission" ]]; then
              xcrun notarytool log "$submission" "${auth[@]}"
            fi
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: frame-studio-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage

  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: desktop
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: frame-studio-*
          path: installers
          merge-multiple: true
      - name: Publish release installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_MACOS: ${{ inputs.replace_macos || false }}
        run: |
          shopt -s nullglob
          version="${RELEASE_TAG#v}"
          mac=(installers/Frame-Studio-"$version"-mac-*.dmg)
          windows=(installers/Frame-Studio-"$version"-win-*.exe)
          linux=(installers/Frame-Studio-"$version"-linux-*.AppImage)
          if (( ${#mac[@]} != 1 || ${#windows[@]} != 1 || ${#linux[@]} != 1 )); then
            echo "Expected exactly one installer per platform for $RELEASE_TAG."
            exit 1
          fi
          packages=("${mac[@]}" "${windows[@]}" "${linux[@]}")

          if existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft); then
            names=$(jq -r '.assets[].name' <<< "$existing")
            if [[ "$REPLACE_MACOS" == 'true' ]]; then
              gh release upload "$RELEASE_TAG" "${mac[0]}" --repo "$GITHUB_REPOSITORY" --clobber
              packages=("${windows[@]}" "${linux[@]}")
            fi
            missing=()
            for package in "${packages[@]}"; do
              if ! grep -Fxq -- "${package##*/}" <<< "$names"; then
                missing+=("$package")
              fi
            done
            if (( ${#missing[@]} )); then
              gh release upload "$RELEASE_TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            fi
            if [[ $(jq -r '.isDraft' <<< "$existing") == true ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "Frame Studio $version" --generate-notes
          fi
